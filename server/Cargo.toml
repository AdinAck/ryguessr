[package]
name = "ryguessr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
axum = "0.8.8"
dotenvy = "0.15.7"
env_logger = "0.11.9"
geo = "0.32.0"
geojson = "0.24.2"
log = "0.4.29"
memmap2 = "0.9"
rand = "0.10.0"
osmpbf = "0.3"
reqwest = { version = "0.13.2", features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
indicatif = "0.17"
futures-util = "0.3"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs"] }
tokio-stream = "0.1.18"
derive_more = { version = "2.1.1", features = ["as_ref", "deref"] }
axum-extra = { version = "0.12.5", features = ["typed-header"] }
async-stream = "0.3.6"
